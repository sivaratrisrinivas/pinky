<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make a promise · Pinky</title>
<style>
  :root { --bg: #fff8fb; --fg: #2b1b24; --muted: #7a5f6d; --accent: #d6336c; --accent-fg: #fff; --card: #fff; --line: #f0d4e0; --ok: #1b7f4b; --err: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1218; --fg: #f7e8ef; --muted: #c7a7b8; --accent: #f06595; --accent-fg: #2b0f1b; --card: #28191f; --line: #46303b; --ok: #6ee7a8; --err: #ff9b94; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
  main { width: 100%; max-width: 28rem; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  #summary { margin: 0 0 16px; color: var(--muted); font-family: ui-monospace, monospace; font-size: .9rem; overflow-wrap: anywhere; }
  #message { margin: 0 0 20px; }
  #message[data-kind="error"] { color: var(--err); }
  #message[data-kind="done"] { color: var(--ok); }
  #actions { display: grid; gap: 10px; }
  button { font: inherit; font-weight: 600; padding: 12px 16px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button:disabled { opacity: .6; cursor: progress; }
  a { color: var(--accent); font-weight: 600; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Pinky promise?</h1>
  <p id="summary"></p>
  <p id="message" role="status" aria-live="polite">Loading…</p>
  <div id="actions"></div>
</main>
<script src="/pay.js"></script>
</body>
</html>
